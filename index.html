.back{transform:rotateY(180deg) translateZ(10px)}
.front img{width:66%;height:auto;display:block}
.back img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;display:block}
.dust{position:absolute;aspect-ratio:1;border-radius:50%;background:#ffd76a;box-shadow:0 0 6px #ffc62f;opacity:0;pointer-events:none;animation:dust 4.5s ease-out infinite}
.rows{display:grid;gap:.85rem}
.row{display:flex;gap:1rem;align-items:center;padding:.95rem 1.1rem;background:rgba(255,255,255,.05);border:1px solid rgba(200,162,74,.4);text-decoration:none;transition:border-color .25s,box-shadow .25s}
.row:hover{border-color:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.row small{display:block;color:#b4c2ba;font-size:.9rem;line-height:1.5}
.row b{display:block;font-weight:700;line-height:1.6;overflow-wrap:anywhere}
.maps{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
.maps .btn{padding:.45rem 1.2rem}
footer{background:var(--green);color:#9fb0a7;text-align:center;font-size:.9rem;padding:1.3rem 1.25rem calc(1.3rem + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(200,162,74,.3)}
.fab{position:fixed;inset-block-end:calc(1rem + env(safe-area-inset-bottom,0px));inset-inline-start:1rem;z-index:15;width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--green);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:ring 2.8s ease-out 3s infinite}
.fab svg{width:28px;height:28px;fill:currentColor}
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.js .rv.in{opacity:1;transform:none}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
@keyframes pop{from{opacity:0;transform:scale(.93)}}
@keyframes sheen{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(200,162,74,.6)}70%,100%{box-shadow:0 0 0 18px rgba(200,162,74,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes turn{0%{transform:rotateY(-540deg);animation-timing-function:cubic-bezier(.12,.65,.2,1)}22%{transform:rotateY(0);animation-timing-function:ease-in-out}34%{transform:rotateY(9deg);animation-timing-function:ease-in-out}46%{transform:rotateY(-6deg);animation-timing-function:ease-in-out}56%{transform:rotateY(0);animation-timing-function:cubic-bezier(.5,0,.2,1)}72%{transform:rotateY(180deg);animation-timing-function:ease-in-out}84%{transform:rotateY(170deg);animation-timing-function:ease-in-out}94%{transform:rotateY(180deg)}100%{transform:rotateY(180deg)}}
@keyframes vis{0%{opacity:0}3%{opacity:1}98%{opacity:1}100%{opacity:0}}
@keyframes dust{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.9}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}
@media(max-width:479px){.call span{display:none}.call{padding:.4rem .7rem}}
@media(min-width:860px){.hero{min-height:calc(min(46vw,560px)*1.25 + 1rem);display:flex;align-items:center;padding-top:2rem}.hin{width:100%}.txt{max-width:54%;margin:0 auto 0 0;padding-bottom:4.2rem}.fig{position:absolute;right:0;bottom:0;margin:0;width:min(46vw,560px)}.cards,.hgrid{grid-template-columns:1fr 1fr}.fin .sec{grid-template-columns:.8fr 1.2fr}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.js .rv{opacity:1;transform:none}.js h2::after{transform:none}}

.inh{--ia:var(--gold,#c8a24a)}
.inh details{border:1px solid rgba(150,140,110,.38);border-radius:20px;margin:.7rem 0;padding:.15rem 1rem;background:rgba(150,150,130,.07);transition:background .3s}
.inh details[open]{background:rgba(150,150,130,.11)}
.inh summary{cursor:pointer;font-weight:700;padding:.75rem 0;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--gt,#7a5a12)}
.inh summary::-webkit-details-marker{display:none}
.inh summary::after{content:"+";font:700 1.4rem/1 sans-serif;color:var(--ia);transition:transform .3s}
.inh details[open] summary::after{content:"−"}
.inh .rw{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.4rem 0;border-top:1px dashed rgba(150,140,110,.3)}
.inh .st{display:flex;align-items:center;gap:.5rem;direction:ltr}
.inh .st button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ia);background:transparent;color:inherit;font:700 1.3rem/1 sans-serif;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .25s}
.inh .st button:active{transform:scale(.88);background:var(--ia);color:#0b2420}
.inh .st output{min-width:2.2ch;text-align:center;font:700 1.15rem sans-serif}
.inh label{display:grid;gap:.25rem;font-weight:700;font-size:.93rem;margin:.5rem 0}
.inh input{width:100%;min-height:46px;padding:.5rem .8rem;border-radius:14px;border:1px solid rgba(150,140,110,.55);background:rgba(255,255,255,.08);color:inherit;font:inherit}
.inh-bar{display:flex;gap:.6rem;flex-wrap:wrap;margin:.8rem 0}
.inh-go{border:0;border-radius:999px;padding:.65rem 1.4rem;font-weight:700;cursor:pointer;color:#0b2420;background:linear-gradient(145deg,#ffe28f,#c8a24a 60%,#a67e26);box-shadow:0 6px 16px rgba(200,162,74,.4)}
.inh-ghost{border:1.5px solid var(--ia);border-radius:999px;padding:.6rem 1.2rem;font-weight:700;cursor:pointer;background:transparent;color:inherit}
.inh-out{display:grid;gap:.5rem;margin-top:.6rem}
.inh-out table{width:100%;border-collapse:collapse;font-size:.95rem}
.inh-out th,.inh-out td{padding:.45rem .4rem;border-bottom:1px solid rgba(150,140,110,.3);text-align:start;vertical-align:top}
.inh-out th{color:var(--gt,#7a5a12);font-size:.85rem}
.inh-sum{font-weight:700;margin:0}.inh-note{margin:0;font-size:.92rem;opacity:.9}.inh-h{margin:.6rem 0 0;font-weight:700;color:var(--gt,#7a5a12)}
.inh-badge{display:inline-block;justify-self:start;padding:.1rem .9rem;border-radius:999px;border:1.5px solid var(--ia);font-weight:700}
.inh-warn{margin:.4rem 0 0;font-size:.88rem;color:var(--terra,#a8452a);font-weight:700}


.dl-info{background:rgba(150,150,130,.1);border:1px solid rgba(150,140,110,.35);border-radius:16px;padding:.6rem .9rem;margin:.6rem 0;font-size:.95rem;white-space:pre-line}
.dl-two{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));margin:.5rem 0}
.dl-chk{display:flex!important;gap:.6rem;align-items:center;font-weight:500!important;margin:.7rem 0}
.dl-row{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.6rem .9rem;border:1px solid rgba(150,140,110,.4);border-radius:16px;background:rgba(150,150,130,.08)}
.dl-row.main{border:2px solid var(--gold,#c8a24a)}.dl-row b{font-size:1.05rem}
.dl-ul{list-style:none;margin:.5rem 0;padding:0;display:grid;gap:.4rem}.dl-ul li{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border:1px solid rgba(150,140,110,.3);border-radius:14px;padding:.3rem .8rem}
.inh select{width:100%;min-height:46px;padding:.5rem .8rem;border-radius:14px;border:1px solid rgba(150,140,110,.55);background:rgba(255,255,255,.08);color:inherit;font:inherit}
.inh select option,.inh select optgroup{color:#14211e;background:#fff}
.seg{display:flex;gap:.3rem;padding:.3rem;border-radius:999px;margin:.2rem 0 1rem;width:max-content;max-width:100%;background:rgba(150,150,130,.12);border:1px solid rgba(200,162,74,.5)}
.seg button{border:0;border-radius:999px;padding:.5rem 1.2rem;font:700 .98rem inherit;font-family:inherit;color:var(--gt,#7a5a12);background:transparent;cursor:pointer;transition:background .3s,color .3s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.seg button[aria-selected=true]{background:linear-gradient(145deg,#ffe28f,#c8a24a);color:#0b2420;box-shadow:0 6px 14px rgba(200,162,74,.45)}
.seg button:active{transform:scale(.94)}

@media(min-width:860px){.portals{grid-template-columns:repeat(20,1fr)}.portals .pt{grid-column:span 5}.portals .pt.tool,.portals .pt.tool.last{grid-column:span 4}.portals .pt.wide{grid-column:6/span 10}.pgh{grid-column:1/-1}}
</style>

<section class="sec" id="about">
  <div class="cards stagger">
    <article class="card">
      <h2 data-t="w_h">مكتب الزلوطي للمحاماة</h2>
      <p data-t="w_p1">يقدّم المكتب الاستشارات القانونية وينوب عن موكليه أمام المحاكم في جميع القضايا، في إطار احترام قواعد المهنة والحفاظ على سرية ما يُعهد إليه من معلومات.</p>
      <p data-t="w_p2">ويضم المكتب فريقًا قانونيًا كفءًا لمواكبتكم في مختلف مراحل ملفاتكم. ويحرص على وضوح التواصل مع موكليه والشفافية في كل مرحلة. وللاستفسار أو لتحديد موعد، يمكنكم التواصل مع المكتب عبر وسائل الاتصال المبيّنة أدناه.</p>
    </article>
    <article class="card">
      <h2 data-t="b_h">الأستاذ عبد الحكيم الزلوطي</h2>
      <p class="sub" data-t="b_sub">محامٍ بهيئة الدار البيضاء</p>
      <p data-t="b_p1">الأستاذ عبد الحكيم الزلوطي محامٍ بهيئة الدار البيضاء. درس الحقوق في المغرب وفرنسا، ويتابع في عمله مستجدات القانون الوطني والدولي.</p>
      <p data-t="b_p2">يقوم عمله على احترام قواعد المهنة والتواصل الواضح مع موكليه.</p>
    </article>
  </div>
</section>

<section class="sec" id="track">
  <h2 class="rv" data-t="tr_h">متابعة مآل الملف</h2>
  <div class="card rv">
    <p class="lead" data-t="tr_p">أدخلوا رقم الملف ورمز الاطلاع الذي سلّمه لكم المكتب.</p>
    <div class="trf">
      <label><span data-t="tr_ref">رقم الملف</span><input id="trref" dir="ltr" autocomplete="off" maxlength="40"></label>
      <label><span data-t="tr_code">رمز الاطلاع</span><input id="trcode" dir="ltr" autocomplete="off" maxlength="40"></label>
      <button type="button" class="btn p" id="trgo" data-t="tr_go">اطلاع</button>
    </div>
    <p class="msg" id="trnf" data-t="tr_nf" hidden>لا يوجد ملف مطابق. تحقّقوا من الرقم والرمز، أو تواصلوا مع المكتب.</p>
    <div id="trres" hidden>
      <div class="steps" id="steps"><div class="step" data-t="st1">قيد الدرس</div><div class="step" data-t="st2">مسطرة جارية</div><div class="step" data-t="st3">ملف مغلق</div></div>
      <p class="upd"><span data-t="tr_up">آخر تحديث</span>: <bdi id="trdate"></bdi></p>
    </div>
    <p class="note" data-t="tr_note">لا تُعرض هنا إلا مرحلة الملف؛ للتفاصيل يرجى التواصل مع المكتب.</p>
    <div class="adm" id="adm" hidden>
      <h3>فضاء المحامي (لا يظهر للزوار)</h3>
      <div class="trf">
        <label><span>رقم الملف</span><input id="aref" dir="ltr" autocomplete="off" maxlength="40"></label>
        <label><span>رمز الاطلاع</span><input id="acode" dir="ltr" autocomplete="off" maxlength="40"></label>
        <label><span>المرحلة</span><select id="astage"><option value="1">قيد الدرس</option><option value="2">مسطرة جارية</option><option value="3">ملف مغلق</option></select></label>
      </div>
      <div class="row2">
        <button type="button" class="btn o" id="agen">توليد رمز</button>
        <button type="button" class="btn p" id="asave">حفظ / تحديث المرحلة</button>
        <button type="button" class="btn o" id="adel">حذف الملف</button>
      </div>
      <p class="msg" id="amsg"></p>
      <p class="note">سجّلوا الرمز قبل الحفظ، فهو لا يُخزَّن في الصفحة، ولا يُحفظ إلا أثره المشفّر. الملفات المسجلة: <bdi id="acnt">0</bdi></p>
    </div>
  </div>

<section class="sec" id="mine" hidden>

    <p class="lead">واجهة خاصة بالمحامي لا تظهر للزوار. تُحفظ المراجع في حسابك وتتزامن بين أجهزتك، فلا تُعاد كتابتها في كل مرة.</p>

<section class="sec" id="help">
  <h2 class="rv" data-t="hp_h">بوابة المساعدة: أدوات قانونية</h2>
  <div class="card rv">
    <p class="lead" data-t="hp_p">خمس أدوات للإرشاد: التعويض عن حوادث السير (ظهير 1984 والقانون 70.24)، والتعويض عن حوادث الشغل (القانون 18.12)، وحاسبة الإرث وفق مدونة الأسرة، وآجال الطعن مدنيًا (القانون 58.25) وجنائيًا، ومعرفة نوع القضية من رمزها.</p>
    <div class="seg" role="tablist"><button type="button" role="tab" aria-selected="true" data-tool="cp" data-t="seg1">حوادث السير</button><button type="button" role="tab" aria-selected="false" data-tool="wk" data-t="seg2">حوادث الشغل</button><button type="button" role="tab" aria-selected="false" data-tool="inh" data-t="seg3">حساب الإرث</button><button type="button" role="tab" aria-selected="false" data-tool="dl" data-t="seg4">الآجال</button><button type="button" role="tab" aria-selected="false" data-tool="cd" data-t="seg5">الرموز</button></div>

    <div id="inhbox" hidden></div>
    <div id="dlbox" hidden></div>
    <div id="cdbox" hidden></div>
    <p class="note" data-t="hp_note">الأدوات بالعربية وللإرشاد فقط، ولا تغني عن النص القانوني ولا عن عقد الإراثة ولا عن استشارة المحامي. والخطأ في الأجل قد يُسقط الحق. وللاستفسار تواصلوا مع المكتب.</p>
  </div>
</section>

var DLUI=(function(){
  var FIXH=['01-01','01-11','01-14','05-01','07-30','08-14','08-20','08-21','11-06','11-18'],HK='zl_site_hol_v1',WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

          $('mlabel').value=x.label||'';$('mcourt').value=x.court||'';$('mroom').value=x.room||'';$('mjudge').value=x.judge||'';$('mtype').value=x.type;$('mno').value=x.no;$('mcode').value=x.code||'';$('myr').value=x.yr;$('mst').value=String(x.st);$('mnote').value=x.note||'';
          editId=x.id;$('msave').textContent='حفظ التعديل';$('mcancel').hidden=false;$('madd').open=true;$('madd').scrollIntoView({behavior:'smooth'});
        });
        var bd=el('button','btn o sm','حذف');bd.type='button';
        bd.addEventListener('click',function(){
          if(armed!==x.id){armed=x.id;bd.textContent='تأكيد الحذف';setTimeout(function(){if(armed===x.id){armed=null;bd.textContent='حذف';}},3000);return;}
          armed=null;var n=Object.assign({},items);delete n[x.id];write(n,'تم حذف الملف.');
        });
        [sel,bc,ao,be,bd].forEach(function(e){bar.appendChild(e);});
        c.appendChild(bar);c.appendChild(actions(x));box.appendChild(c);
      });
    }
    $('mine').hidden=false;
    $('mflt').addEventListener('change',render);
    $('mcancel').addEventListener('click',clearForm);
    $('msave').addEventListener('click',async function(){
      var o={label:$('mlabel').value.trim(),court:$('mcourt').value.trim(),room:$('mroom').value.trim(),judge:$('mjudge').value.trim(),type:$('mtype').value,no:$('mno').value.trim(),code:$('mcode').value.trim(),yr:$('myr').value.trim(),st:+$('mst').value,note:$('mnote').value.trim(),u:today(),acts:(editId&&items[editId]&&items[editId].acts)||[]};
      if(!o.no||!o.yr){mm('أدخلوا رقم الملف وسنته على الأقل.');return;}
      var n=Object.assign({},items),k=editId||('f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
      n[k]=o;
      if(await write(n,editId?'تم حفظ التعديل.':'تمت إضافة الملف.')){clearForm();$('madd').open=false;}
    });
    var first=true;
    ref.onSnapshot(function(s){var d=s.exists?s.data():null;items=(d&&d.items)||{};if(first){first=false;if(!Object.keys(items).length)$('madd').open=true;}render();},function(e){mm('تعذر قراءة الملفات: '+((e&&e.code)||''));});
  }catch(e){}
})();

(function(){
  INHUI($('inhbox'));DLUI($('dlbox'));CDUI($('cdbox'));CPUI($('cpbox'));WKUI($('wkbox'));
  function showTool(t){[].slice.call(document.querySelectorAll('.seg button')).forEach(function(x){x.setAttribute('aria-selected',x.getAttribute('data-tool')===t?'true':'false');});['cp','wk','inh','dl','cd'].forEach(function(k){var e=$(k+'box');if(e)e.hidden=(k!==t);});}
  [].slice.call(document.querySelectorAll('.seg button')).forEach(function(b){b.addEventListener('click',function(){showTool(b.getAttribute('data-tool'));});});
  [].slice.call(document.querySelectorAll('.pt.tool')).forEach(function(a){a.addEventListener('click',function(){showTool(a.getAttribute('data-tool'));});});
  var prog=$('prog'),dock=$('dock'),ind=$('cind'),calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var chips=[].slice.call(document.querySelectorAll('#chips a'));
  function moveInd(){var on=chips.filter(function(c){return c.getAttribute('aria-current')==='true';})[0];if(!on){ind.style.width='0px';return;}ind.style.left=on.offsetLeft+'px';ind.style.width=on.offsetWidth+'px';}
  function onScroll(){var h=document.documentElement,m=h.scrollHeight-h.clientHeight;prog.style.width=(m>0?Math.min(100,h.scrollTop/m*100):0)+'%';if(dock&&!calm)dock.style.setProperty('--sy',Math.min(60,h.scrollTop*.06)+'px');}
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  window.addEventListener('resize',moveInd);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);
  var lm=$('lmenu');if(lm)lm.addEventListener('click',function(){setTimeout(moveInd,120);});
  if('IntersectionObserver' in window){
    var spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){chips.forEach(function(c){c.setAttribute('aria-current',c.getAttribute('data-sp')===e.target.id?'true':'false');});moveInd();}});},{rootMargin:'-35% 0px -60% 0px'});
    ['about','track','help','hours','contact'].forEach(function(id){var s=$(id);if(s)spy.observe(s);});
  }
  if(!calm)document.querySelectorAll('.pt').forEach(function(a){var i=a.querySelector('.pti');
    a.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;var r=i.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;i.style.setProperty('--ry',(x*12).toFixed(1)+'deg');i.style.setProperty('--rx',(-y*12).toFixed(1)+'deg');i.style.setProperty('--mx',(e.clientX-r.left)+'px');i.style.setProperty('--my',(e.clientY-r.top)+'px');});
    a.addEventListener('pointerleave',function(){i.style.setProperty('--rx','0deg');i.style.setProperty('--ry','0deg');});
    a.addEventListener('pointerdown',function(e){var r=i.getBoundingClientRect(),d=document.createElement('span');d.className='rip';d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';i.appendChild(d);setTimeout(function(){d.remove();},850);});});
})();
document.querySelectorAll('.stagger').forEach(function(g){[].forEach.call(g.children,function(c,k){c.classList.add('rv');c.style.transitionDelay=(k*110)+'ms';});});
var rv=document.querySelectorAll('.rv');
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var t=e.target;t.classList.add('in');io.unobserve(t);setTimeout(function(){t.style.transitionDelay='';},1500);}});},{threshold:.15});
  rv.forEach(function(el){io.observe(el);});
}else{rv.forEach(function(el){el.classList.add('in');});}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('animate').forEach(function(a){a.remove();});}
})();
</script>
