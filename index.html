/* ===== the bar: the look beside the language, and Qalam's name where «اتصل بنا» was («قلم», or «Qalam» for French and English) ===== */
.bar .thb{display:grid;place-items:center;width:38px;height:38px;min-height:38px;padding:0;border:1px solid var(--gold);background:none;color:var(--gold);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s}
.bar .thb:active{transform:scale(.9) rotate(-25deg)}
.bar .thb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"] .thb .su,:root[data-theme="light"] .thb .mo{display:none}
/* the office's emblem in its round frame, as at the top of the app; Qalam's name right after it (on the right in Arabic, on the left in
   French and English), as tall as the frame */
.bar .bemb{display:grid;place-items:center;flex:none;width:50px;height:50px;box-sizing:border-box;border-radius:50%;border:1px solid rgba(230,200,115,.55);background:rgba(255,226,143,.08);box-shadow:inset 0 1px 0 rgba(255,246,207,.08),0 4px 14px rgba(0,0,0,.25);overflow:hidden}
.bar .bemb img{width:42px!important;height:42px!important;object-fit:contain;border-radius:50%;filter:none!important}
.bar .qwm{display:flex;align-items:center;line-height:0;text-decoration:none;flex:none}
.bar .qwm img{display:none;height:50px!important;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
html[lang=ar]:not([data-theme="light"]) .qwm .qw-ad,html[lang=ar][data-theme="light"] .qwm .qw-al,html:not([lang=ar]):not([data-theme="light"]) .qwm .qw-ld,html:not([lang=ar])[data-theme="light"] .qwm .qw-ll{display:block}
/* Match the visible width of the Arabic Qalam artwork across both themes. */
html[lang=ar][data-theme="light"] .bar .qwm .qw-al{transform:scale(1.16);transform-origin:center center}
@media(max-width:600px){.bar .bemb{width:44px;height:44px}.bar .bemb img{width:37px!important;height:37px!important}.bar .qwm img{height:44px!important}.bar .thb{width:36px;height:36px;min-height:36px}}

/* «Qalam» in Latin letters: a fifth smaller than the frame beside it */

@media(max-width:350px){html:not([lang=ar]) .bar .qwm img{height:32px!important}}

<section class="sec" id="about">
  <div class="cards stagger">
    <article class="card">
      <h2 data-t="w_h">مكتب الزلوطي للمحاماة</h2>
      <p data-t="w_p1">يقدّم المكتب الاستشارات القانونية وينوب عن موكليه أمام المحاكم في جميع القضايا، في إطار احترام قواعد المهنة والحفاظ على سرية ما يُعهد إليه من معلومات.</p>
      <p data-t="w_p2">ويضم المكتب فريقًا قانونيًا مؤهلًا لمواكبتكم في مختلف مراحل ملفاتكم. ويحرص على وضوح التواصل مع موكليه والشفافية في كل مرحلة. وللاستفسار أو لتحديد موعد، يمكنكم التواصل مع المكتب عبر وسائل الاتصال المبيّنة أدناه.</p>
    </article>
    <article class="card">
      <h2 data-t="b_h">الأستاذ عبد الحكيم الزلوطي</h2>
      <p class="sub" data-t="b_sub">محامٍ بهيئة الدار البيضاء</p>
      <p data-t="b_p1">الأستاذ عبد الحكيم الزلوطي محامٍ بهيئة الدار البيضاء. درس الحقوق في المغرب وفرنسا، ويتابع في عمله مستجدات القانون الوطني والدولي.</p>
      <p data-t="b_p2">يقوم عمله على احترام قواعد المهنة والتواصل الواضح مع موكليه.</p>
    </article>
  </div>
</section>

<section class="sec" id="mine" hidden>
  <h2 class="rv">ملفاتي</h2>
  <div class="card rv">
    <p class="lead">واجهة خاصة بالمحامي لا تظهر للزوار. تُحفظ المراجع في حسابك وتتزامن بين أجهزتك، فلا تُعاد كتابتها في كل مرة.</p>

      var list=Object.keys(items).map(function(k){return Object.assign({id:k},items[k]);}).filter(function(x){return f==='0'||String(x.st)===f;}).sort(function(p,q){return (q.u||'').localeCompare(p.u||'');});
      $('mcnt').textContent='عدد الملفات: '+Object.keys(items).length;
      box.textContent='';
      if(!Object.keys(items).length)box.appendChild(el('p','meta','لا توجد ملفات بعد. أضيفوا ملفًا من «إضافة ملف جديد» أدناه، وستظهر تحته خانة «الإجراءات السابقة» بتواريخها وساعاتها.'));
      list.forEach(function(x){
        var c=el('div','fc'),top=el('div','row2'),bar=el('div','row2');
        top.appendChild(el('span','chip s'+x.st,STN[x.st]));
        top.appendChild(el('span','meta','آخر تحديث: '+fd(x.u)));
        c.appendChild(el('h4',null,x.label||'ملف بدون عنوان'));
        c.appendChild(el('p','meta',refLine(x)));
        if(x.room||x.judge)c.appendChild(el('p','meta','القاعة: '+(x.room||'—')+' | القاضي(ة) المقرر(ة): '+(x.judge||'—')));
        if(x.note)c.appendChild(el('p','meta',x.note));
        var la=(x.acts||[]).slice().sort(function(p,q){return ((q.d||'')+(q.t||'')).localeCompare((p.d||'')+(p.t||''));})[0];
        if(la)c.appendChild(el('p','meta','آخر إجراء: '+fd(la.d)+(la.t?' | '+la.t:'')+' — '+la.a));
        c.appendChild(top);
        var sel=el('select');[1,2,3].forEach(function(i){var o=el('option',null,STN[i]);o.value=i;if(i===x.st)o.selected=true;sel.appendChild(o);});
        sel.addEventListener('change',function(){var n=Object.assign({},items);n[x.id]=Object.assign({},items[x.id],{st:+sel.value,u:today()});write(n);});
        var bc=el('button','btn o sm','نسخ المرجع');bc.type='button';
        bc.addEventListener('click',async function(){var t=refText(x);try{await navigator.clipboard.writeText(t);mm('تم نسخ المرجع.',true);}catch(e){mm(t,true);}});
        var ao=el('a','btn o sm','فتح خدمة تتبع الملفات');ao.href='https://www.mahakim.ma/';ao.target='_blank';ao.rel='noopener';
        var be=el('button','btn o sm','تعديل');be.type='button';
        be.addEventListener('click',function(){
          $('mlabel').value=x.label||'';$('mcourt').value=x.court||'';$('mroom').value=x.room||'';$('mjudge').value=x.judge||'';$('mtype').value=x.type;$('mno').value=x.no;$('mcode').value=x.code||'';$('myr').value=x.yr;$('mst').value=String(x.st);$('mnote').value=x.note||'';
          editId=x.id;$('msave').textContent='حفظ التعديل';$('mcancel').hidden=false;$('madd').open=true;$('madd').scrollIntoView({behavior:'smooth'});
        });
        var bd=el('button','btn o sm','حذف');bd.type='button';
        bd.addEventListener('click',function(){
          if(armed!==x.id){armed=x.id;bd.textContent='تأكيد الحذف';setTimeout(function(){if(armed===x.id){armed=null;bd.textContent='حذف';}},3000);return;}
          armed=null;var n=Object.assign({},items);delete n[x.id];write(n,'تم حذف الملف.');
        });
        [sel,bc,ao,be,bd].forEach(function(e){bar.appendChild(e);});
        c.appendChild(bar);c.appendChild(actions(x));box.appendChild(c);
      });
    }
    $('mine').hidden=false;
    $('mflt').addEventListener('change',render);
    $('mcancel').addEventListener('click',clearForm);
    $('msave').addEventListener('click',async function(){
      var o={label:$('mlabel').value.trim(),court:$('mcourt').value.trim(),room:$('mroom').value.trim(),judge:$('mjudge').value.trim(),type:$('mtype').value,no:$('mno').value.trim(),code:$('mcode').value.trim(),yr:$('myr').value.trim(),st:+$('mst').value,note:$('mnote').value.trim(),u:today(),acts:(editId&&items[editId]&&items[editId].acts)||[]};
      if(!o.no||!o.yr){mm('أدخلوا رقم الملف وسنته على الأقل.');return;}
      var n=Object.assign({},items),k=editId||('f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
      n[k]=o;
      if(await write(n,editId?'تم حفظ التعديل.':'تمت إضافة الملف.')){clearForm();$('madd').open=false;}
    });
    var first=true;
    ref.onSnapshot(function(s){var d=s.exists?s.data():null;items=(d&&d.items)||{};if(first){first=false;if(!Object.keys(items).length)$('madd').open=true;}render();},function(e){mm('تعذر قراءة الملفات: '+((e&&e.code)||''));});
  }catch(e){}
})();

(function(){

(function(){

  }).catch(function(){});
})();

  function showTool(t){[].slice.call(document.querySelectorAll('.seg button')).forEach(function(x){x.setAttribute('aria-selected',x.getAttribute('data-tool')===t?'true':'false');});['cp','wk','inh','dl','cd'].forEach(function(k){var e=$(k+'box');if(e)e.hidden=(k!==t);});}
  [].slice.call(document.querySelectorAll('.seg button')).forEach(function(b){b.addEventListener('click',function(){showTool(b.getAttribute('data-tool'));});});
  [].slice.call(document.querySelectorAll('.pt.tool')).forEach(function(a){a.addEventListener('click',function(){showTool(a.getAttribute('data-tool'));});});
  var prog=$('prog'),dock=$('dock'),ind=$('cind'),calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var chips=[].slice.call(document.querySelectorAll('#chips a'));
  function moveInd(){var on=chips.filter(function(c){return c.getAttribute('aria-current')==='true';})[0];if(!on){ind.style.width='0px';return;}ind.style.left=on.offsetLeft+'px';ind.style.width=on.offsetWidth+'px';}
  function onScroll(){var h=document.documentElement,m=h.scrollHeight-h.clientHeight;prog.style.width=(m>0?Math.min(100,h.scrollTop/m*100):0)+'%';if(dock&&!calm)dock.style.setProperty('--sy',Math.min(60,h.scrollTop*.06)+'px');}
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  window.addEventListener('resize',moveInd);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);
  var lm=$('lmenu');if(lm)lm.addEventListener('click',function(){setTimeout(moveInd,120);});
  if('IntersectionObserver' in window){
    var spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){chips.forEach(function(c){c.setAttribute('aria-current',c.getAttribute('data-sp')===e.target.id?'true':'false');});moveInd();}});},{rootMargin:'-35% 0px -60% 0px'});
    ['about','track','help','hours','contact','links'].forEach(function(id){var s=$(id);if(s)spy.observe(s);}); window.addEventListener('scroll',function(){if(innerHeight+scrollY>=document.documentElement.scrollHeight-8){chips.forEach(function(c){c.setAttribute('aria-current',c.getAttribute('data-sp')==='links'?'true':'false');});moveInd();}},{passive:true});
  }
  if(!calm)document.querySelectorAll('.pt').forEach(function(a){var i=a.querySelector('.pti');
    a.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;var r=i.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;i.style.setProperty('--ry',(x*12).toFixed(1)+'deg');i.style.setProperty('--rx',(-y*12).toFixed(1)+'deg');i.style.setProperty('--mx',(e.clientX-r.left)+'px');i.style.setProperty('--my',(e.clientY-r.top)+'px');});
    a.addEventListener('pointerleave',function(){i.style.setProperty('--rx','0deg');i.style.setProperty('--ry','0deg');});
    a.addEventListener('pointerdown',function(e){var r=i.getBoundingClientRect(),d=document.createElement('span');d.className='rip';d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';i.appendChild(d);setTimeout(function(){d.remove();},850);});});
})();
document.querySelectorAll('.stagger').forEach(function(g){[].forEach.call(g.children,function(c,k){c.classList.add('rv');c.style.transitionDelay=(k*110)+'ms';});});
var rv=document.querySelectorAll('.rv');
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var t=e.target;t.classList.add('in');io.unobserve(t);setTimeout(function(){t.style.transitionDelay='';},1500);}});},{threshold:.15});
  rv.forEach(function(el){io.observe(el);});
}else{rv.forEach(function(el){el.classList.add('in');});}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('animate').forEach(function(a){a.remove();});}
})();
