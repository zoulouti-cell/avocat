<section class="sec" id="about">
  <div class="cards stagger">
    <article class="card">
      <h2 data-t="w_h">مكتب الزلوطي للمحاماة</h2>
      <p data-t="w_p1">يقدّم المكتب الاستشارات القانونية وينوب عن موكليه أمام المحاكم في جميع القضايا، في إطار احترام قواعد المهنة والحفاظ على سرية ما يُعهد إليه من معلومات.</p>
      <p data-t="w_p2">ويضم المكتب فريقًا قانونيًا كفءًا لمواكبتكم في مختلف مراحل ملفاتكم. ويحرص على وضوح التواصل مع موكليه والشفافية في كل مرحلة. وللاستفسار أو لتحديد موعد، يمكنكم التواصل مع المكتب عبر وسائل الاتصال المبيّنة أدناه.</p>
    </article>
    <article class="card">
      <h2 data-t="b_h">الأستاذ رشيد الزلوطي</h2>
      <p class="sub" data-t="b_sub">محامٍ بهيئة الدار البيضاء</p>
      <p data-t="b_p1">الأستاذ رشيد الزلوطي محامٍ بهيئة الدار البيضاء، وباحث في القانون والمستجدات الرقمية.</p>
      <p data-t="b_p2">يقوم عمله على احترام قواعد المهنة والتواصل الواضح مع موكليه.</p>
    </article>
  </div>
</section>

<section class="sec" id="track">
  <h2 class="rv" data-t="tr_h">متابعة مآل الملف</h2>
  <div class="card rv">
    <p class="lead" data-t="tr_p">أدخلوا رقم الملف ورمز الاطلاع الذي سلّمه لكم المكتب.</p>
    <div class="trf">
      <label><span data-t="tr_ref">رقم الملف</span><input id="trref" dir="ltr" autocomplete="off" maxlength="40"></label>
      <label><span data-t="tr_code">رمز الاطلاع</span><input id="trcode" dir="ltr" autocomplete="off" maxlength="40"></label>
      <button type="button" class="btn p" id="trgo" data-t="tr_go">اطلاع</button>
    </div>
    <p class="msg" id="trnf" data-t="tr_nf" hidden>لا يوجد ملف مطابق. تحقّقوا من الرقم والرمز، أو تواصلوا مع المكتب.</p>
    <div id="trres" hidden>
      <div class="steps" id="steps"><div class="step" data-t="st1">قيد الدرس</div><div class="step" data-t="st2">مسطرة جارية</div><div class="step" data-t="st3">ملف مغلق</div></div>
      <p class="upd"><span data-t="tr_up">آخر تحديث</span>: <bdi id="trdate"></bdi></p>
    </div>
    <p class="note" data-t="tr_note">لا تُعرض هنا إلا مرحلة الملف؛ للتفاصيل يرجى التواصل مع المكتب.</p>
    <div class="adm" id="adm" hidden>
      <h3>فضاء المحامي (لا يظهر للزوار)</h3>
      <div class="trf">
        <label><span>رقم الملف</span><input id="aref" dir="ltr" autocomplete="off" maxlength="40"></label>
        <label><span>رمز الاطلاع</span><input id="acode" dir="ltr" autocomplete="off" maxlength="40"></label>
        <label><span>المرحلة</span><select id="astage"><option value="1">قيد الدرس</option><option value="2">مسطرة جارية</option><option value="3">ملف مغلق</option></select></label>
      </div>
      <div class="row2">
        <button type="button" class="btn o" id="agen">توليد رمز</button>
        <button type="button" class="btn p" id="asave">حفظ / تحديث المرحلة</button>
        <button type="button" class="btn o" id="adel">حذف الملف</button>
      </div>
      <p class="msg" id="amsg"></p>
      <p class="note">سجّلوا الرمز قبل الحفظ، فهو لا يُخزَّن في الصفحة، ولا يُحفظ إلا أثره المشفّر. الملفات المسجلة: <bdi id="acnt">0</bdi></p>
    </div>
  </div>
</section>

<section class="sec" id="mine" hidden>
  <h2 class="rv">ملفاتي</h2>
  <div class="card rv">
    <p class="lead">واجهة خاصة بالمحامي لا تظهر للزوار. تُحفظ المراجع في حسابك وتتزامن بين أجهزتك، فلا تُعاد كتابتها في كل مرة.</p>

<section class="sec tools-only" id="help">
  <h2 class="rv" data-t="hp_h">بوابة المساعدة: أدوات قانونية</h2>
  <div class="card rv">
    <p class="lead" data-t="hp_p">خمس أدوات للإرشاد: التعويض عن حوادث السير (ظهير 1984 والقانون 70.24)، والتعويض عن حوادث الشغل (القانون 18.12)، وحاسبة الإرث وفق مدونة الأسرة، وآجال الطعن مدنيًا (القانون 58.25) وجنائيًا، ومعرفة نوع القضية من رمزها.</p>
    <div class="seg" role="tablist"><button type="button" role="tab" aria-selected="true" data-tool="cp" data-t="seg1">حوادث السير</button><button type="button" role="tab" aria-selected="false" data-tool="wk" data-t="seg2">حوادث الشغل</button><button type="button" role="tab" aria-selected="false" data-tool="inh" data-t="seg3">حساب الإرث</button><button type="button" role="tab" aria-selected="false" data-tool="dl" data-t="seg4">الآجال</button><button type="button" role="tab" aria-selected="false" data-tool="cd" data-t="seg5">الرموز</button></div>

    <div id="wkbox" hidden></div>
    <div id="inhbox" hidden></div>
    <div id="dlbox" hidden></div>
    <div id="cdbox" hidden></div>
    <p class="note" data-t="hp_note">الأدوات بالعربية وللإرشاد فقط، ولا تغني عن النص القانوني ولا عن عقد الإراثة ولا عن استشارة المحامي. والخطأ في الأجل قد يُسقط الحق. وللاستفسار تواصلوا مع المكتب.</p>
  </div>
</section>

  return '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n'+HEAD+'<style id="css">'+$('css').textContent+'</style>\n</head>\n<body>\n<template id="tpl">'+$('tpl').innerHTML+'</template>\n<script type="application/json" id="reg">'+JSON.stringify(next).replace(/</g,'\\u003c')+'<\/script>\n<script id="app">'+$('app').textContent+'<\/script>\n</body>\n</html>\n';
}
(async function(){
  if(!window.claude||!window.claude.use)return;
  try{
    var u=await window.claude.use('user'),a=await window.claude.use('artifact');
    if(!u||!a||!(await u.isOwner()))return;
    $('adm').hidden=false;$('acnt').textContent=Object.keys(reg.items).length;
    var say=function(t,ok){var m=$('amsg');m.textContent=t;m.className='msg'+(ok?' ok':'');};
    var push=async function(next){try{await a.publish(buildHtml(next));say('تم الحفظ، وستُحمَّل الصفحة من جديد.',true);}catch(e){say('تعذر الحفظ: '+((e&&e.code)||e));}};
    $('agen').addEventListener('click',function(){var al='ABCDEFGHJKMNPQRSTUVWXYZ23456789',b=crypto.getRandomValues(new Uint8Array(10)),s='';for(var i=0;i<10;i++)s+=al[b[i]%al.length];$('acode').value=s.slice(0,5)+'-'+s.slice(5);});
    $('asave').addEventListener('click',async function(){
      var r=$('aref').value,c=$('acode').value;
      if(!norm(r)||norm(c).length<8){say('أدخلوا رقم الملف ورمزًا من 8 رموز على الأقل (يمكن توليده).');return;}
      var k=await keyOf(r,c),next=JSON.parse(JSON.stringify(reg));
      next.items[k]={s:+$('astage').value,d:new Date().toISOString().slice(0,10)};
      await push(next);
    });
    $('adel').addEventListener('click',async function(){
      var r=$('aref').value,c=$('acode').value;
      if(!norm(r)||!norm(c)){say('أدخلوا رقم الملف والرمز.');return;}
      var k=await keyOf(r,c);
      if(!reg.items[k]){say('لا يوجد ملف مطابق.');return;}
      var next=JSON.parse(JSON.stringify(reg));delete next.items[k];await push(next);
    });
  }catch(e){}
})();

(async function(){
  if(!window.claude||!window.claude.use)return;
  try{
    var u=await window.claude.use('user'),db=await window.claude.use('db');
    if(!u||!db||!(await u.isOwner()))return;
    var uid=await u.id();if(!uid)return;
    var ref=db.doc('data/users/'+uid+'/files'),items={},editId=null,busy=false,armed=null,open={};
    var STN={1:'قيد الدرس',2:'مسطرة جارية',3:'ملف مغلق'};
    var today=function(){return new Date().toISOString().slice(0,10);};
    var fd=function(d){return d?d.split('-').reverse().join('/'):'';};
    var mm=function(t,ok){var m=$('mmsg');m.textContent=t;m.className='msg'+(ok?' ok':'');};
    var el=function(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
    var refText=function(f){return 'المحكمة: '+(f.court||'—')+'، نوع الملف: '+f.type+'، الرقم: '+f.no+(f.code?'، الرمز: '+f.code:'')+'، السنة: '+f.yr;};
    var refLine=function(f){return (f.court||'—')+' | '+f.type+' | '+f.no+(f.code?' / '+f.code:'')+' / '+f.yr;};
    var field=function(lbl,inp){var l=el('label');l.appendChild(el('span',null,lbl));l.appendChild(inp);return l;};
    async function write(next,ok){
      if(busy)return false;busy=true;
      try{await ref.set({items:next});if(ok)mm(ok,true);busy=false;return true;}
      catch(e){mm('تعذر الحفظ: '+((e&&e.code)||e));busy=false;return false;}
    }
    function clearForm(){['mlabel','mcourt','mroom','mjudge','mno','mcode','myr','mnote'].forEach(function(i){$(i).value='';});$('mtype').selectedIndex=0;$('mst').value='1';editId=null;$('msave').textContent='إضافة الملف';$('mcancel').hidden=true;}
    function actions(x){
      var acts=(x.acts||[]).map(function(a,i){return Object.assign({i:i},a);}).sort(function(p,q){return ((q.d||'')+(q.t||'')).localeCompare((p.d||'')+(p.t||''));});
      var box=el('div','pbox');
      box.appendChild(el('h5',null,'الإجراءات السابقة ('+acts.length+')'));
      if(!acts.length)box.appendChild(el('p','meta','لا توجد إجراءات مسجلة بعد.'));
      var ul=el('ul','al');
      acts.forEach(function(a){
        var li=el('li'),dt=el('span','dt',fd(a.d)+(a.t?' | '+a.t:''));dt.dir='ltr';
        li.appendChild(dt);
        if(a.r)li.appendChild(el('span','meta','القاعة: '+a.r));
        li.appendChild(el('span',null,a.a));
        var xb=el('button','btn o sm x','حذف');xb.type='button';
        xb.addEventListener('click',function(){
          var key=x.id+':'+a.i;
          if(armed!==key){armed=key;xb.textContent='تأكيد الحذف';setTimeout(function(){if(armed===key){armed=null;xb.textContent='حذف';}},3000);return;}
          armed=null;var n=Object.assign({},items),arr=(items[x.id].acts||[]).slice();arr.splice(a.i,1);
          n[x.id]=Object.assign({},items[x.id],{acts:arr});open[x.id]=true;write(n,'تم حذف الإجراء.');
        });
        li.appendChild(xb);ul.appendChild(li);
      });
      if(acts.length)box.appendChild(ul);
      var det=el('details');
      det.appendChild(el('summary',null,'تسجيل إجراء جديد'));
      if(open[x.id])det.open=true;
      det.addEventListener('toggle',function(){open[x.id]=det.open;});
      var f=el('div','trf'),idt=el('input'),itm=el('input'),irm=el('input'),iac=el('input'),add=el('button','btn p sm','إضافة إجراء');
      idt.type='date';idt.value=today();itm.type='time';irm.value=x.room||'';irm.maxLength=40;iac.maxLength=200;add.type='button';
      f.appendChild(field('التاريخ',idt));f.appendChild(field('الساعة',itm));f.appendChild(field('القاعة',irm));f.appendChild(field('الإجراء المتخذ',iac));f.appendChild(add);
      add.addEventListener('click',function(){
        var a=iac.value.trim();if(!idt.value||!a){mm('أدخلوا تاريخ الإجراء ونصه.');return;}
        var cur=items[x.id],n=Object.assign({},items);
        n[x.id]=Object.assign({},cur,{acts:(cur.acts||[]).concat([{d:idt.value,t:itm.value,r:irm.value.trim(),a:a}]),u:today()});
        open[x.id]=true;write(n,'تم تسجيل الإجراء.');
      });
      det.appendChild(f);box.appendChild(det);return box;
    }
    function render(){
      var f=$('mflt').value,box=$('mlist');
      var list=Object.keys(items).map(function(k){return Object.assign({id:k},items[k]);}).filter(function(x){return f==='0'||String(x.st)===f;}).sort(function(p,q){return (q.u||'').localeCompare(p.u||'');});
      $('mcnt').textContent='عدد الملفات: '+Object.keys(items).length;
      box.textContent='';
      if(!Object.keys(items).length)box.appendChild(el('p','meta','لا توجد ملفات بعد. أضيفوا ملفًا من «إضافة ملف جديد» أدناه، وستظهر تحته خانة «الإجراءات السابقة» بتواريخها وساعاتها.'));
      list.forEach(function(x){
        var c=el('div','fc'),top=el('div','row2'),bar=el('div','row2');
        top.appendChild(el('span','chip s'+x.st,STN[x.st]));
        top.appendChild(el('span','meta','آخر تحديث: '+fd(x.u)));
        c.appendChild(el('h4',null,x.label||'ملف بدون عنوان'));
        c.appendChild(el('p','meta',refLine(x)));
        if(x.room||x.judge)c.appendChild(el('p','meta','القاعة: '+(x.room||'—')+' | القاضي(ة) المقرر(ة): '+(x.judge||'—')));
        if(x.note)c.appendChild(el('p','meta',x.note));
        var la=(x.acts||[]).slice().sort(function(p,q){return ((q.d||'')+(q.t||'')).localeCompare((p.d||'')+(p.t||''));})[0];
        if(la)c.appendChild(el('p','meta','آخر إجراء: '+fd(la.d)+(la.t?' | '+la.t:'')+' — '+la.a));
        c.appendChild(top);
        var sel=el('select');[1,2,3].forEach(function(i){var o=el('option',null,STN[i]);o.value=i;if(i===x.st)o.selected=true;sel.appendChild(o);});
        sel.addEventListener('change',function(){var n=Object.assign({},items);n[x.id]=Object.assign({},items[x.id],{st:+sel.value,u:today()});write(n);});
        var bc=el('button','btn o sm','نسخ المرجع');bc.type='button';
        bc.addEventListener('click',async function(){var t=refText(x);try{await navigator.clipboard.writeText(t);mm('تم نسخ المرجع.',true);}catch(e){mm(t,true);}});
        var ao=el('a','btn o sm','فتح خدمة تتبع الملفات');ao.href='https://www.mahakim.ma/';ao.target='_blank';ao.rel='noopener';
        var be=el('button','btn o sm','تعديل');be.type='button';
        be.addEventListener('click',function(){
          $('mlabel').value=x.label||'';$('mcourt').value=x.court||'';$('mroom').value=x.room||'';$('mjudge').value=x.judge||'';$('mtype').value=x.type;$('mno').value=x.no;$('mcode').value=x.code||'';$('myr').value=x.yr;$('mst').value=String(x.st);$('mnote').value=x.note||'';
          editId=x.id;$('msave').textContent='حفظ التعديل';$('mcancel').hidden=false;$('madd').open=true;$('madd').scrollIntoView({behavior:'smooth'});
        });
        var bd=el('button','btn o sm','حذف');bd.type='button';
        bd.addEventListener('click',function(){
          if(armed!==x.id){armed=x.id;bd.textContent='تأكيد الحذف';setTimeout(function(){if(armed===x.id){armed=null;bd.textContent='حذف';}},3000);return;}
          armed=null;var n=Object.assign({},items);delete n[x.id];write(n,'تم حذف الملف.');
        });
        [sel,bc,ao,be,bd].forEach(function(e){bar.appendChild(e);});
        c.appendChild(bar);c.appendChild(actions(x));box.appendChild(c);
      });
    }
    $('mine').hidden=false;
    $('mflt').addEventListener('change',render);
    $('mcancel').addEventListener('click',clearForm);
    $('msave').addEventListener('click',async function(){
      var o={label:$('mlabel').value.trim(),court:$('mcourt').value.trim(),room:$('mroom').value.trim(),judge:$('mjudge').value.trim(),type:$('mtype').value,no:$('mno').value.trim(),code:$('mcode').value.trim(),yr:$('myr').value.trim(),st:+$('mst').value,note:$('mnote').value.trim(),u:today(),acts:(editId&&items[editId]&&items[editId].acts)||[]};
      if(!o.no||!o.yr){mm('أدخلوا رقم الملف وسنته على الأقل.');return;}
      var n=Object.assign({},items),k=editId||('f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
      n[k]=o;
      if(await write(n,editId?'تم حفظ التعديل.':'تمت إضافة الملف.')){clearForm();$('madd').open=false;}
    });
    var first=true;
    ref.onSnapshot(function(s){var d=s.exists?s.data():null;items=(d&&d.items)||{};if(first){first=false;if(!Object.keys(items).length)$('madd').open=true;}render();},function(e){mm('تعذر قراءة الملفات: '+((e&&e.code)||''));});
  }catch(e){}
})();

(function(){
  INHUI($('inhbox'));DLUI($('dlbox'));CDUI($('cdbox'));CPUI($('cpbox'));WKUI($('wkbox'));
(function(){
  /* addresses can be corrected in config.json under "links" */
  fetch('config.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(c){
    if(!c||!c.links)return;
    [].slice.call(document.querySelectorAll('.xb')).forEach(function(a){var u=String(c.links[a.getAttribute('data-k')]||'').trim();if(/^https:\/\//i.test(u))a.setAttribute('href',u);});
  }).catch(function(){});
})();

  function showTool(t){[].slice.call(document.querySelectorAll('.seg button')).forEach(function(x){x.setAttribute('aria-selected',x.getAttribute('data-tool')===t?'true':'false');});['cp','wk','inh','dl','cd'].forEach(function(k){var e=$(k+'box');if(e)e.hidden=(k!==t);});}
  [].slice.call(document.querySelectorAll('.seg button')).forEach(function(b){b.addEventListener('click',function(){showTool(b.getAttribute('data-tool'));});});
  [].slice.call(document.querySelectorAll('.pt.tool')).forEach(function(a){a.addEventListener('click',function(){showTool(a.getAttribute('data-tool'));});});
  var prog=$('prog'),dock=$('dock'),ind=$('cind'),calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var chips=[].slice.call(document.querySelectorAll('#chips a'));
  function moveInd(){var on=chips.filter(function(c){return c.getAttribute('aria-current')==='true';})[0];if(!on){ind.style.width='0px';return;}ind.style.left=on.offsetLeft+'px';ind.style.width=on.offsetWidth+'px';}
  function onScroll(){var h=document.documentElement,m=h.scrollHeight-h.clientHeight;prog.style.width=(m>0?Math.min(100,h.scrollTop/m*100):0)+'%';if(dock&&!calm)dock.style.setProperty('--sy',Math.min(60,h.scrollTop*.06)+'px');}
  window.addEventListener('scroll',onScroll,{passive:true});onScroll();
  window.addEventListener('resize',moveInd);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);
  var lm=$('lmenu');if(lm)lm.addEventListener('click',function(){setTimeout(moveInd,120);});
  if('IntersectionObserver' in window){
    var spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){chips.forEach(function(c){c.setAttribute('aria-current',c.getAttribute('data-sp')===e.target.id?'true':'false');});moveInd();}});},{rootMargin:'-35% 0px -60% 0px'});
    ['about','track','help','hours','contact'].forEach(function(id){var s=$(id);if(s)spy.observe(s);});
  }
  if(!calm)document.querySelectorAll('.pt').forEach(function(a){var i=a.querySelector('.pti');
    a.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;var r=i.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;i.style.setProperty('--ry',(x*12).toFixed(1)+'deg');i.style.setProperty('--rx',(-y*12).toFixed(1)+'deg');i.style.setProperty('--mx',(e.clientX-r.left)+'px');i.style.setProperty('--my',(e.clientY-r.top)+'px');});
    a.addEventListener('pointerleave',function(){i.style.setProperty('--rx','0deg');i.style.setProperty('--ry','0deg');});
    a.addEventListener('pointerdown',function(e){var r=i.getBoundingClientRect(),d=document.createElement('span');d.className='rip';d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';i.appendChild(d);setTimeout(function(){d.remove();},850);});});
})();
document.querySelectorAll('.stagger').forEach(function(g){[].forEach.call(g.children,function(c,k){c.classList.add('rv');c.style.transitionDelay=(k*110)+'ms';});});
var rv=document.querySelectorAll('.rv');
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var t=e.target;t.classList.add('in');io.unobserve(t);setTimeout(function(){t.style.transitionDelay='';},1500);}});},{threshold:.15});
  rv.forEach(function(el){io.observe(el);});
}else{rv.forEach(function(el){el.classList.add('in');});}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('animate').forEach(function(a){a.remove();});}
})();
</script>
